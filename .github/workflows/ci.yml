name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: xvfb-run -a npm run test:options:functional
      - run: npm run check
      - run: python3 scripts/build-release.py --target firefox "$RUNNER_TEMP/Clockoli-firefox.xpi"
      - run: npm run lint:firefox
