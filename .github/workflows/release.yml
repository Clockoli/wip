name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag: { description: 'Tag to release', required: true, type: string }

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      firefox-signing: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run check
      # The archive is uploaded to the Chrome Web Store as-is, so it must carry the tagged version.
      - name: Check tag matches manifest version
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Error: tag $TAG does not match manifest.json version $VERSION"
            exit 1
          fi
      - run: python3 scripts/build-release.py "$RUNNER_TEMP/Clockoli-$TAG.zip"
      - run: python3 scripts/build-release.py --target firefox "$RUNNER_TEMP/Clockoli-$TAG-firefox.xpi"
      - run: python3 scripts/build-release.py --target safari "$RUNNER_TEMP/Clockoli-$TAG-safari-extension.zip"
      - run: npm run lint:firefox
      - run: git archive --format=zip --output="$RUNNER_TEMP/Clockoli-$TAG-source.zip" "$TAG"
      - name: Detect Firefox signing configuration
        id: signing
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] || [ -n "$AMO_JWT_SECRET" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-browser-packages
          path: ${{ runner.temp }}/Clockoli-*
          if-no-files-found: error

  firefox-sign:
    needs: package
    if: needs.package.outputs.firefox-signing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sign:firefox -- "$RUNNER_TEMP/signed"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-firefox-signed
          path: ${{ runner.temp }}/signed/*.xpi
          if-no-files-found: error

  safari:
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Build Safari app and configured distribution packages
        run: python3 scripts/build-safari.py --build-number "$GITHUB_RUN_NUMBER" "$RUNNER_TEMP/safari"
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_CERTIFICATES_P12_BASE64: ${{ secrets.APPLE_CERTIFICATES_P12_BASE64 }}
          APPLE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-safari
          path: ${{ runner.temp }}/safari/Clockoli-*
          if-no-files-found: error

  collect:
    needs: [package, firefox-sign, safari]
    if: >-
      ${{ !cancelled() && needs.package.result == 'success' && needs.safari.result == 'success' &&
          (needs.firefox-sign.result == 'success' || needs.firefox-sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  release:
    needs: collect
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    permissions:
      contents: write
    uses: Muvon/ci-workflow/.github/workflows/release.yml@master
    with:
      tag: ${{ inputs.tag }}
      artifacts: release-zip
      draft: false
