<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Top tasks · Clockoli</title>
  <link rel="stylesheet" href="tasks.css">
  <link rel="stylesheet" href="../styles/page-tabs.css">
</head>
<body>
  <div class="page-tabs-shell">
    <nav class="page-tabs" aria-label="Clockoli pages">
      <a class="page-brand" href="../times/times.html" aria-label="Clockoli Activity"><img src="../assets/clockoli-with-text.svg" alt=""></a>
      <a class="page-tab" href="../times/times.html">Activity</a>
      <a class="page-tab" href="../tasks/tasks.html" aria-current="page">Top tasks</a>
      <a class="page-tab" href="../reports/reports.html">Reports</a>
      <a class="page-tab" href="../options/options.html">Settings</a>
    </nav>
  </div>
  <main>
    <section class="toolbar" aria-label="Task filters">
      <input id="task-filter" type="text" autocomplete="off" placeholder="Filter by URL or optional title" aria-label="Filter tracked tasks">
      <label>Period
        <select id="period">
          <option value="two-weeks">Last 2 weeks</option>
          <option value="one-month">Last month</option>
          <option value="three-months">Last 3 months</option>
          <option value="six-months">Last 6 months</option>
          <option value="one-year">Last year</option>
        </select>
      </label>
    </section>

    <div id="error" class="notice error" role="alert" hidden></div>
    <div id="loading" class="loading" role="status" aria-label="Loading tracked tasks"><span class="loading-spinner" aria-hidden="true"></span></div>
    <div id="setup" class="notice" hidden>
      Configure a private time-data repository before opening tracked work.
      <button id="setup-settings" class="button" type="button">Open Settings</button>
    </div>

    <section id="tasks-content" class="tasks-card" hidden aria-labelledby="result-count">
      <header class="list-header"><strong id="result-count">0 results</strong><button id="refresh-tasks" class="icon-button" type="button" title="Sync and refresh" aria-label="Sync and refresh"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"/></svg></button></header>
      <div id="task-list" aria-live="polite"></div>
      <p id="empty" class="empty" hidden>No tracked work matches these filters.</p>
    </section>
  </main>
  <script src="../domain/recovery-actions.js"></script>
<script type="module" src="tasks.js"></script>
</body>
</html>
