      <label>Period
        <select id="period">
          <option value="two-weeks">Last 2 weeks</option>
          <option value="one-month">Last month</option>
          <option value="three-months">Last 3 months</option>
          <option value="six-months">Last 6 months</option>
          <option value="one-year">Last year</option>
        </select>
      </label>
    </section>

    <div id="error" class="notice error" role="alert" hidden></div>
    <div id="partial-status" class="notice" role="status" hidden></div>
    <div id="loading" class="loading" role="status" aria-label="Loading tracked tasks"><span class="loading-spinner" aria-hidden="true"></span></div>

      Choose where Clockoli should save your time before opening tracked work.
      <button id="setup-settings" class="button" type="button">Set up Clockoli</button>
    </div>
